<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14202e;--mut:#59677a;--line:#e3e8ef}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#141d2c;--ink:#e8edf5;--mut:#9aa8bb;--line:#243146}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"Helvetica Neue",Arial,sans-serif}

header .logo{width:46px;height:46px;flex:none}header .wm{height:24px;width:auto;display:block}
header small{display:block;color:#9fb0c8;font-weight:700;font-size:.72rem;letter-spacing:.12em;margin-top:4px}
main{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.plate{display:flex;align-items:stretch;border:3px solid #111;border-radius:8px;overflow:hidden;background:#fff;color:#111;font:800 1.7rem/1 -apple-system,Arial;letter-spacing:.06em}
.plate .eu{background:#1747b8;color:#fff;font-size:.6rem;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:4px 6px;letter-spacing:0}
.plate .eu i{color:#ffd400;font-style:normal;font-size:.9rem;line-height:1;margin-bottom:auto}
.plate b{padding:8px 12px}
.name{font-weight:800;font-size:1.25rem}.sub{color:var(--mut);font-size:.9rem}
h2{font-size:.75rem;letter-spacing:.12em;color:var(--mut);margin:0 0 8px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.row .l{font-weight:700;flex:1}.row .d{color:var(--mut);font-size:.88rem;display:block;font-weight:400}
.pill{font-weight:700;font-size:.85rem;padding:5px 11px;border-radius:999px;white-space:nowrap}
.ok{background:#dff3e7;color:#17663f}.warn{background:#fcefcb;color:#7d5200}.hot{background:#ffe4cc;color:#9a3412}.bad{background:#fde3e0;color:#a8231b}.none{background:#eef1f6;color:#59677a}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem}.kv span{color:var(--mut)}.kv b{word-break:break-all}
.sum{display:flex;gap:8px;margin-top:12px}.sum div{flex:1;text-align:center;border-radius:12px;padding:8px 4px;font-size:.78rem;font-weight:700}.sum b{display:block;font-size:1.3rem}
footer{color:var(--mut);font-size:.8rem;text-align:center;padding:4px 16px 30px}
.err{text-align:center;padding:40px 10px;color:var(--mut)}
</style></head><body>

<script>
(function(){
var DOCS={r:'RCA',i:'ITP',v:'Rovinieta',c:'CASCO',s:'Stingator',t:'Trusa medicala'};
var KIND={auto:'Autoturism',moto:'Motocicleta',scuter:'Scuter',camion:'Camion'};
var LUNI=['Ianuarie','Februarie','Martie','Aprilie','Mai','Iunie','Iulie','August','Septembrie','Octombrie','Noiembrie','Decembrie'];
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dec(h){h=String(h||'').replace(/^#/,'');if(!h)return null;
  var p=h.split('~').map(function(v){try{return decodeURIComponent(v)}catch(e){return v}});if(p[0]!=='1')return null;
  function iso(v){return /^\d{6}$/.test(v||'')?'20'+v.slice(0,2)+'-'+v.slice(2,4)+'-'+v.slice(4,6):(v==='-'?'-':'')}
  var d=[];function put(k,ds,n){var x=iso(ds);if(x)d.push([k,x,n||''])}
  put('r',p[8],p[9]);put('i',p[10]);put('v',p[11],p[12]);put('c',p[13],p[14]);put('s',p[15]);put('t',p[16]);
  return {p:p[1],b:p[2],m:p[3],k:p[4],v:p[5],km:p[6],o:p[7],d:d}}
function show(iso){var p=iso.split('-');return (+p[2]<10?'0':'')+(+p[2])+' '+LUNI[+p[1]-1]+' '+p[0]}
function left(iso){var p=iso.split('-'),t=new Date(),a=Date.UTC(+p[0],+p[1]-1,+p[2]),b=Date.UTC(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-b)/864e5)}
function st(d){if(d<0)return ['bad','expirat de '+(-d)+(d===-1?' zi':' de zile')];if(d===0)return ['bad','expira azi'];if(d<=7)return ['hot','in '+d+(d===1?' zi':' zile')];if(d<=30)return ['warn','in '+d+' de zile'];return ['ok','in '+d+' de zile']}
var c;try{c=dec(location.hash)}catch(e){c=null}
var app=document.getElementById('app');
if(!c){app.innerHTML='<div class="err">Codul QR nu contine date Dash13.</div>';return}
var h='<div class="card"><div class="top"><div class="plate"><span class="eu"><i>&#9733;</i>RO</span><b>'+esc(c.p||'—')+'</b></div><div><div class="name">'+esc([c.b,c.m].filter(Boolean).join(' '))+'</div><div class="sub">'+esc([KIND[c.k]||'',c.km?Number(c.km).toLocaleString('ro-RO')+' km':''].filter(Boolean).join(' · '))+'</div></div></div>';
var n={bad:0,warn:0,ok:0},rows='';
(c.d||[]).forEach(function(x){var lab=DOCS[x[0]]||x[0],pill;
  if(x[1]==='-'){pill='<span class="pill none">Nu am</span>'}
  else{var s=st(left(x[1]));n[s[0]==='hot'?'warn':s[0]]++;pill='<span class="pill '+s[0]+'">'+s[1]+'</span>'}
  rows+='<div class="row"><div class="l">'+esc(lab)+'<span class="d">'+(x[1]==='-'?'':'Expira la '+show(x[1]))+(x[2]?' · '+esc(x[2]):'')+'</span></div>'+pill+'</div>'});
h+='<div class="sum"><div class="bad"><b>'+n.bad+'</b>expirate</div><div class="warn"><b>'+n.warn+'</b>in 30 de zile</div><div class="ok"><b>'+n.ok+'</b>in regula</div></div></div>';
h+='<div class="card"><h2>Documente</h2>'+rows+'</div>';
var kv=[['Serie sasiu',c.v],['Proprietar',c.o]].filter(function(r){return r[1]});
if(kv.length)h+='<div class="card"><h2>Date vehicul</h2><div class="kv">'+kv.map(function(r){return '<span>'+r[0]+'</span><b>'+esc(r[1])+'</b>'}).join('')+'</div></div>';
app.innerHTML=h;
})();
</script></body></html>
